[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# 1. API so'rovlarini Netlify Functions'ga yo'naltirish
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 2. React SPA dagi ichki sahifalar yuklanganda (Reload) 404 xatosi bo'lmasligi uchun yo'naltirish
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
